name: CI - Library API

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean compile
      env:
        MAVEN_OPTS: -Xmx1024m

    - name: Run unit tests
      run: mvn test
      env:
        SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/library_test

    - name: Generate code coverage
      run: mvn jacoco:report

    - name: Build application
      run: mvn package -DskipTests

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: library-api-jar
        path: target/library-api-*.jar

  sonarqube:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run tests and generate coverage
      run: mvn clean test jacoco:report
      env:
        SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/library_test

    - name: SonarQube Scan
      # AJUSTE 1: Validação correta se o Token do Sonar realmente existe antes de rodar
      if: ${{ secrets.SONAR_TOKEN != '' }}
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  integration-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Run integration tests with Testcontainers
      run: mvn test -Pintegration
      env:
        MAVEN_OPTS: -Xmx1024m

  security-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run OWASP Dependency Check
      run: mvn org.owasp:dependency-check-maven:check
      continue-on-error: true

  quality-gate:
    needs: [ build-and-test, sonarqube, integration-tests ]
    runs-on: ubuntu-latest
    # AJUSTE 2: Garante que o Quality Gate rode mesmo se os testes de integração forem pulados (na develop)
    if: always() && (needs.build-and-test.result == 'success')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # AJUSTE 3: Baixa o JAR que já foi criado no primeiro passo (Economiza muito tempo!)
    - name: Download build artifact
      uses: actions/download-artifact@v3
      with:
        name: library-api-jar
        path: target/

    - name: Check build success
      run: |
        if [ ! -f target/library-api-*.jar ]; then
          echo "Build artifact not found!"
          exit 1
        fi
        echo "✅ Build quality gate passed!"