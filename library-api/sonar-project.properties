# SonarQube Configuration - Library API
# ======================================

# Project identification
sonar.projectKey=library-api
sonar.projectName=Library API - Gerenciador de Biblioteca Pessoal
sonar.projectVersion=0.0.1-SNAPSHOT
sonar.projectDescription=API REST para gerenciamento de biblioteca pessoal com Spring Boot, MongoDB e autenticação

# Source code
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.inclusions=**/*.java
sonar.exclusions=**/dto/**,**/model/**,**/exception/**

# Binaries
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/lib/*.jar

# Code coverage (JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=**/dto/**,**/model/**,**/exception/**,**/config/**

# Language
sonar.language=java

# Rules
sonar.java.source=21
sonar.java.target=21

# Analysis
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
